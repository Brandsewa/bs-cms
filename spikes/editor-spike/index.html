<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tiptap Editor Prototype & Benchmark</title>
  <style>
    body {
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      max-width: 800px;
      margin: 40px auto;
      padding: 0 20px;
      color: #0f172a;
    }
    #metrics-panel {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 24px;
      font-family: monospace;
      font-size: 14px;
    }
    .metric-row {
      display: flex;
      justify-content: space-between;
      padding: 4px 0;
    }
    .metric-val {
      font-weight: bold;
      color: #2563eb;
    }
    #editor-container {
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      padding: 24px;
      min-height: 500px;
      position: relative;
    }
    .tiptap {
      outline: none;
      min-height: 400px;
    }
    .tiptap p {
      line-height: 1.6;
      margin: 0.8em 0;
    }
    .tiptap h1, .tiptap h2, .tiptap h3 {
      line-height: 1.3;
    }
    .tiptap img {
      max-width: 100%;
      height: auto;
      border-radius: 4px;
    }
    /* Slash menu */
    #slash-menu {
      position: absolute;
      background: white;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
      width: 200px;
      display: none;
      z-index: 50;
    }
    .slash-item {
      padding: 8px 12px;
      cursor: pointer;
      font-size: 14px;
    }
    .slash-item:hover, .slash-item.selected {
      background: #f1f5f9;
      color: #2563eb;
    }
    /* Bubble menu */
    #bubble-menu {
      position: absolute;
      background: #1e293b;
      color: white;
      padding: 4px 8px;
      border-radius: 6px;
      display: none;
      gap: 4px;
      z-index: 50;
    }
    .bubble-btn {
      background: transparent;
      border: none;
      color: white;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 12px;
    }
    .bubble-btn:hover {
      background: #334155;
    }
  </style>
</head>
<body>
  <h1>BS CMS — Tiptap 10,000-Word Editor Spike</h1>
  
  <div id="metrics-panel">
    <div class="metric-row"><span>Document Word Count:</span><span id="word-count" class="metric-val">Calculating...</span></div>
    <div class="metric-row"><span>Time to Interactive (TTI):</span><span id="tti" class="metric-val">Measuring...</span></div>
    <div class="metric-row"><span>Typing Latency (Sampled over 50 keystrokes):</span><span id="typing-latency" class="metric-val">Measuring...</span></div>
  </div>

  <div id="editor-container">
    <div id="bubble-menu">
      <button class="bubble-btn" id="btn-bold">Bold</button>
      <button class="bubble-btn" id="btn-italic">Italic</button>
      <button class="bubble-btn" id="btn-strike">Strike</button>
      <button class="bubble-btn" id="btn-code">Code</button>
    </div>

    <div id="slash-menu">
      <div class="slash-item" data-command="h2">Heading 2</div>
      <div class="slash-item" data-command="h3">Heading 3</div>
      <div class="slash-item" data-command="bulletList">Bullet List</div>
      <div class="slash-item" data-command="image">Sample Image</div>
    </div>

    <div id="editor"></div>
  </div>

  <script type="module" src="./src/main.ts"></script>
</body>
</html>
