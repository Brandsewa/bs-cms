; Hostinger Simulation PHP 8.3 configuration override
[PHP]
memory_limit = 2048M
max_execution_time = 360
max_input_time = 360
upload_max_filesize = 2048M
post_max_size = 2048M
disable_functions = system, exec, shell_exec, passthru, mysql_list_dbs, ini_alter, dl, symlink, link, chgrp, leak, popen, apache_child_terminate, virtual, mb_send_mail, proc_open
date.timezone = UTC
display_errors = Off
log_errors = On

[opcache]
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 10000
