name: Deploy Astro Site

on:
  repository_dispatch:
    types: [deploy_site]
  workflow_dispatch:
    inputs:
      deployment_id:
        description: 'Optional BS CMS deployment ID'
        required: false
        type: string
      callback_url:
        description: 'Optional callback URL'
        required: false
        type: string
      callback_token:
        description: 'Optional callback token'
        required: false
        type: string

concurrency:
  group: deploy-site
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build & Deploy Astro Site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: starter
        run: npm install

      - name: Notify build started
        if: "${{ github.event.inputs.callback_url != '' || github.event.client_payload.callback_url != '' }}"
        run: |
          CALLBACK_URL="${{ github.event.client_payload.callback_url || github.event.inputs.callback_url }}"
          CALLBACK_TOKEN="${{ github.event.client_payload.callback_token || github.event.inputs.callback_token }}"
          curl -s -X POST "$CALLBACK_URL" \
            -H "Authorization: Bearer $CALLBACK_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"status":"building"}' || true

      - name: Build Astro site
        working-directory: starter
        run: npm run build
        env:
          CMS_URL: ${{ secrets.BS_CMS_URL }}
          BUILD_TOKEN: ${{ secrets.BS_BUILD_TOKEN }}

      - name: Deploy to Hostinger via rsync over SSH with CMS Safeguards
        env:
          SSH_KEY: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          SSH_PORT: ${{ secrets.HOSTINGER_SSH_PORT || 65002 }}
          SSH_USER: ${{ secrets.HOSTINGER_SSH_USER }}
          DEPLOY_PATH: ${{ secrets.HOSTINGER_DEPLOY_PATH }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          python3 starter/scripts/install-ssh-key.py
          chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 || echo "Warning: ssh-keygen could not parse key"
          ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

          # Rsync changed files with strict excludes protecting CMS core files from deletion:
          # Note: -c (--checksum) skips files based on 128-bit checksum instead of mtime/size,
          # ensuring clean zero-delta transfer for files with identical contents across fresh checkouts.
          rsync -avzc --delete \
            --exclude='/index.php' \
            --exclude='/core/' \
            --exclude='/media/' \
            --exclude='/admin/' \
            --exclude='/storage/' \
            --exclude='/config/' \
            --exclude='/migrations/' \
            --exclude='/resources/' \
            --exclude='/bin/' \
            --exclude='/vendor/' \
            --exclude='/composer.*' \
            -e "ssh -i /home/runner/.ssh/id_ed25519 -p $SSH_PORT -o StrictHostKeyChecking=yes" \
            starter/dist/ \
            "$SSH_USER@$SSH_HOST:$DEPLOY_PATH"

      - name: Notify build succeeded
        if: "${{ success() && (github.event.inputs.callback_url != '' || github.event.client_payload.callback_url != '') }}"
        run: |
          CALLBACK_URL="${{ github.event.client_payload.callback_url || github.event.inputs.callback_url }}"
          CALLBACK_TOKEN="${{ github.event.client_payload.callback_token || github.event.inputs.callback_token }}"
          curl -s -X POST "$CALLBACK_URL" \
            -H "Authorization: Bearer $CALLBACK_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"status":"succeeded"}' || true

      - name: Notify build failed
        if: "${{ failure() && (github.event.inputs.callback_url != '' || github.event.client_payload.callback_url != '') }}"
        run: |
          CALLBACK_URL="${{ github.event.client_payload.callback_url || github.event.inputs.callback_url }}"
          CALLBACK_TOKEN="${{ github.event.client_payload.callback_token || github.event.inputs.callback_token }}"
          LOG_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -s -X POST "$CALLBACK_URL" \
            -H "Authorization: Bearer $CALLBACK_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"status\":\"failed\",\"log_url\":\"$LOG_URL\"}" || true
