name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Phase 5 UI jobs: gated on UI paths so the PHP jobs are unaffected.
  ui-changes:
    name: Detect UI changes
    runs-on: ubuntu-latest
    outputs:
      ui: ${{ steps.diff.outputs.ui }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Diff against the merge base
        id: diff
        run: |
          if [ -n "${{ github.event.pull_request.base.sha }}" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="$(git rev-parse HEAD~1 2>/dev/null || echo HEAD)"
          fi
          if git diff --name-only "$BASE" HEAD | grep -qE '^(packages/ui/|packages/client/|admin/|package\.json$|package-lock\.json$|eslint\.config\.js$|\.github/workflows/ci\.yml$)'; then
            echo "ui=true" >> "$GITHUB_OUTPUT"
          else
            echo "ui=false" >> "$GITHUB_OUTPUT"
          fi

  ui-lint-typecheck-test:
    name: UI Lint, Typecheck & Tests
    runs-on: ubuntu-latest
    needs: ui-changes
    if: needs.ui-changes.outputs.ui == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: UI Lint
        run: npm run lint

      - name: UI Typecheck
        run: npm run typecheck

      - name: Check generated client up to date
        run: npm run check-generated -w @bs/client

      - name: UI Tests
        run: npm test

      - name: NPM Security Audit (production deps)
        run: npm audit --omit=dev

  ui-axe:
    name: UI Axe Accessibility
    runs-on: ubuntu-latest
    needs: ui-changes
    if: needs.ui-changes.outputs.ui == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Gallery axe suite (zero serious/critical violations)
        run: npm run test:axe

  ui-size-budget:
    name: UI Bundle Size Budget
    runs-on: ubuntu-latest
    needs: ui-changes
    if: needs.ui-changes.outputs.ui == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build @bs/ui and admin
        run: npm run build

      - name: Enforce size budget and gallery exclusion
        run: node admin/scripts/check-size.mjs

  ui-real-browser:
    name: UI Real-Browser Tests (boot, axe contrast)
    runs-on: ubuntu-latest
    needs: ui-changes
    if: needs.ui-changes.outputs.ui == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Build admin bundle
        run: npm run build -w admin

      - name: Browser tests (SPA deep-link boot, gallery axe light+dark)
        run: npx playwright test -c admin/playwright.config.ts

  node:
    name: Node Linters & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Node Lint
        run: npm run lint

      - name: Node Typecheck
        run: npm run typecheck

      - name: Node Tests
        run: npm run test

      - name: NPM Security Audit
        run: npm audit --omit=dev

  php-quality:
    name: PHP Quality (CS, Stan, Audit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_mysql, sodium, curl, fileinfo, zip
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict
        working-directory: core

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress
        working-directory: core

      - name: PHP Coding Standards Check
        run: composer cs
        working-directory: core

      - name: PHPStan Analysis
        run: composer stan
        working-directory: core

      - name: Composer Security Audit
        run: composer audit
        working-directory: core

  release-build:
    name: Build & Verify Release Zip
    runs-on: ubuntu-latest
    needs: [php-quality]
    services:
      database:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: bscms_release
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping -u root --password=root" --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_mysql, sodium, curl, fileinfo, zip
          coverage: none

      - name: Build release archive
        run: bash tools/build-release 1.0.0-dev

      - name: Verify release zip permissions (fail on 777 or 666 entries)
        run: |
          zipinfo build/bs-cms-1.0.0-dev.zip | grep -E "(rwxrwxrwx|rw-rw-rw-)" && {
            echo "ERROR: Found 777 or 666 entry in zip!"
            exit 1
          } || echo "Permissions check passed: no 777 or 666 entries found."

      - name: Verify release zip with php -S server
        run: |
          mkdir -p /tmp/bs-cms-test
          unzip -q build/bs-cms-1.0.0-dev.zip -d /tmp/bs-cms-test
          cd /tmp/bs-cms-test/core
          # Start background built-in PHP web server serving on [::]:8888 with index.php as router script
          php -S [::]:8888 -t public public/index.php > /tmp/php-server.log 2>&1 &
          SERVER_PID=$!
          sleep 2

          # 1. Test /health returns 200 and {"status":"ok"} with RateLimit-* and Cache-Control: no-store
          HEALTH_RESP=$(curl -s -i http://127.0.0.1:8888/health)
          echo "$HEALTH_RESP"
          echo "$HEALTH_RESP" | grep -q "200 OK"
          echo "$HEALTH_RESP" | grep -q '{"status":"ok"}'
          echo "$HEALTH_RESP" | grep -i "cache-control" | grep -q "no-store"

          # 1b. Test live IPv6 connection via curl -g -6 to [::1]:8888
          IPV6_HEALTH=$(curl -g -6 -s -i http://[::1]:8888/health)
          echo "$IPV6_HEALTH" | grep -q "200 OK"

          # 2. Test /health with POST returns 405 Method Not Allowed
          POST_HEALTH=$(curl -s -o /dev/null -w "%{http_code}" -X POST http://127.0.0.1:8888/health)
          test "$POST_HEALTH" -eq 405

          # 3. Test /install returns 200 setup page with Cache-Control: no-store
          INSTALL_RESP=$(curl -s -i http://127.0.0.1:8888/install)
          echo "$INSTALL_RESP" | grep -q "200 OK"
          echo "$INSTALL_RESP" | grep -q "BS CMS Setup"
          echo "$INSTALL_RESP" | grep -i "cache-control" | grep -q "no-store"

          # 4. Test missing CSRF on POST /install/database returns 403 Problem Details
          CSRF_RESP=$(curl -s -i -X POST http://127.0.0.1:8888/install/database)
          echo "$CSRF_RESP" | grep -q "403 Forbidden"
          echo "$CSRF_RESP" | grep -q "application/problem+json"

          # 5. Run migrations via CLI tool and configure app to test live post-install API endpoints
          mkdir -p config
          echo "<?php return ['name' => 'CI Test', 'env' => 'production', 'url' => 'http://127.0.0.1:8888', 'key' => 'base64:$(openssl rand -base64 32)'];" > config/app.php
          echo "<?php return ['host' => '127.0.0.1', 'port' => 3306, 'database' => 'bscms_release', 'username' => 'root', 'password' => 'root', 'prefix' => 'bs_'];" > config/database.php
          php bin/bs migrate
          php bin/bs schema:seed
          touch storage/installed.lock

          # Unauthenticated protected API route returns 401 Problem Details (proves ApiRoutes and AuthenticateMiddleware are active in front controller)
          API_AUTH_RESP=$(curl -s -i http://127.0.0.1:8888/api/v1/auth/session)
          echo "$API_AUTH_RESP"
          echo "$API_AUTH_RESP" | grep -q "401 Unauthorized"
          echo "$API_AUTH_RESP" | grep -q "application/problem+json"

          # Bad login returns 401 with generic message
          LOGIN_RESP=$(curl -s -i -X POST http://127.0.0.1:8888/api/v1/auth/login -H "Content-Type: application/json" -d '{"email":"test@example.com","password":"bad"}')
          echo "$LOGIN_RESP"
          echo "$LOGIN_RESP" | grep -q "401 Unauthorized"
          # 6. Execute full live HTTP test suite covering all Phase 2 defects
          php "$GITHUB_WORKSPACE/tools/test-release-http.php" http://127.0.0.1:8888 /tmp/bs-cms-test/core

          kill $SERVER_PID

  php-test-matrix:
    name: PHP ${{ matrix.php }} on ${{ matrix.db.name }} ${{ matrix.db.version }}
    runs-on: ubuntu-latest
    needs: [php-quality]
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
        db:
          - { name: 'MySQL', image: 'mysql:8.0', version: '8.0' }
          - { name: 'MySQL', image: 'mysql:8.4', version: '8.4' }
          - { name: 'MariaDB', image: 'mariadb:10.6', version: '10.6' }
          - { name: 'MariaDB', image: 'mariadb:10.11', version: '10.11' }
          - { name: 'MariaDB', image: 'mariadb:11.4', version: '11.4' }
    services:
      database:
        image: ${{ matrix.db.image }}
        env:
          MYSQL_ROOT_PASSWORD: root
          MARIADB_ROOT_PASSWORD: root
          MYSQL_DATABASE: bscms_test
          MARIADB_DATABASE: bscms_test
        ports:
          - 3306:3306
        options: --health-cmd="mariadb-admin ping -u root --password=root || mysqladmin ping -u root --password=root" --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo_mysql, sodium, curl, fileinfo, zip, json, ctype, filter
          coverage: none

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress
        working-directory: core

      - name: Run PHPUnit
        run: composer test
        working-directory: core
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: bscms_test
          DB_USER: root
          DB_PASS: root
