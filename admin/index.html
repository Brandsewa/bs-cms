<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- The CMS host sends X-Robots-Tag: noindex; repeated here as defence in depth. -->
    <meta name="robots" content="noindex, nofollow" />
    <title>BS CMS</title>
    <!-- Suppress the browser's automatic /favicon.ico request (404 on static hosts). -->
    <link rel="icon" href="data:," />
    <!--
      Applies the stored theme before first paint (no flash of wrong theme).
      External file, loaded synchronously, rewritten onto the build base
      (/admin/theme-init.js): the admin CSP is script-src 'self' with no
      inline scripts.
    -->
    <script src="/theme-init.js"></script>
    <!--
      Paint the themed background before the CSS bundle loads (dark mode
      otherwise flashes browser-default white). Values mirror tokens.css
      (--background light/dark). Inline style is fine here: the admin CSP
      allows style-src 'unsafe-inline'.
    -->
    <style>
      html { background-color: hsl(0, 0%, 100%); }
      html.dark { background-color: hsl(0, 0%, 9%); }
      html, body { margin: 0; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
